name: Publish Quarto Book

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev

      - name: Install R packages
        run: |
          install.packages(
            c(
              "dplyr",
              "ggplot2",
              "patchwork",
              "scales",
              "forcats",
              "stringr",
              "tidyr",
              "gridExtra",
              "knitr",
              "rmarkdown",
              "quarto"
            ),
            repos = "https://cloud.r-project.org"
          )
        shell: Rscript {0}

      # Optional if your analyses require development versions
      # - name: Install finto
      #   run: remotes::install_github("YOURNAME/finto")
      #   shell: Rscript {0}

      # - name: Install finna
      #   run: remotes::install_github("YOURNAME/finna")
      #   shell: Rscript {0}

      - name: Render Quarto Book
        run: quarto render

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
